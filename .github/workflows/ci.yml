name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        # Serialize test files for the required-browser pass. The Chromium lifecycle
        # tests are individually bounded and correct, but running several
        # browser-heavy files concurrently adds enough scheduler contention that
        # recovery operations intermittently exceed those deliberately tight bounds.
        # Ordinary local `npm test` keeps vitest's default file parallelism.
        run: npm run test -- --fileParallelism=false
        env:
          REQUIRE_BROWSER_TESTS: "1"
      - name: Build
        run: npm run build

  docker:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: marketplace:ci
      - name: Verify Chromium in the image
        run: >-
          docker run --rm --entrypoint node marketplace:ci --input-type=module -e
          "import('playwright').then(async ({chromium})=>{const c=await chromium.launchPersistentContext('/tmp/marketplace-profile',{headless:true});const p=await c.newPage();await p.setContent('<h1>ok</h1>');console.log('chromium-ok');await c.close();}).catch((e)=>{console.error(e);process.exit(1)})"
      - name: Smoke-test re-auth console stack
        run: |
          output=$(docker run --rm --network none -v "$PWD/scripts:/smoke:ro" --entrypoint node marketplace:ci /smoke/reauth-smoke.mjs)
          printf '%s\n' "$output"
          grep -Fq 'SMOKE_RESULT {"orphans":[],"tempDirectories":[]}' <<<"$output"
